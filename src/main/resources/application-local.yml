spring:
  datasource:
    url: jdbc:h2:mem:taskmanager
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
  cloud:
    aws:
      sqs:
        enabled: false

# SQS disabled in local profile — NoOpTaskEventPublisher is used
